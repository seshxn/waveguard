[tool.poetry]
name = "waveguard-backend"
version = "0.1.0"
description = "Backend API and detection engine for WaveGuard"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = "^0.32.0"
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"
sqlmodel = "^0.0.22"
alembic = "^1.13.0"
psycopg2-binary = "^2.9.9"
asyncpg = "^0.30.0"
python-multipart = "^0.0.17"
httpx = "^0.27.0"
python-telegram-bot = "^21.7"
numpy = "^2.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
