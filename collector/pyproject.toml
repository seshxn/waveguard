[tool.poetry]
name = "waveguard-collector"
version = "0.1.0"
description = "Wi-Fi metric collector for WaveGuard"
authors = ["WaveGuard Team"]

[tool.poetry.dependencies]
python = "^3.11"
httpx = "^0.27.0"
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
